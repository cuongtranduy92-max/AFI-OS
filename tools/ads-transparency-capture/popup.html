<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AFI-OS Capture</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;width:360px;margin:0;padding:14px;color:#13201c;background:#f4f7f5}
    h1{font-size:15px;margin:0 0 4px}.sub{font-size:10px;color:#67726e;margin-bottom:12px}
    form{display:grid;gap:9px}label{display:grid;gap:4px;font-size:10px;color:#5e6a66;font-weight:650}
    input,textarea{width:100%;box-sizing:border-box;border:1px solid #d7dfdb;border-radius:8px;padding:8px;background:#fff;font:inherit;font-size:12px}
    textarea{min-height:80px;resize:vertical}button{border:0;border-radius:8px;padding:9px 12px;background:#176b58;color:#fff;font-weight:700;cursor:pointer}
    #message{font-size:10px;color:#5e6a66;min-height:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  </style>
</head>
<body>
  <h1>AFI-OS Capture Helper</h1>
  <div class="sub">Có thể Capture ngay. Bỏ trống advertiser/domain sẽ đưa snapshot vào hàng đợi duyệt.</div>
  <form id="form">
    <label>Advertiser name (optional)<input name="advertiser_name" placeholder="Bổ sung bây giờ hoặc duyệt sau"></label>
    <div class="row">
      <label>Location<input name="advertiser_location"></label>
      <label>Country<input name="country" maxlength="2" placeholder="VN"></label>
    </div>
    <label>Project domain (optional)<input name="project_domain" placeholder="pictory.ai"></label>
    <div class="row">
      <label>Brand name<input name="brand_name"></label>
      <label>Category<input name="category"></label>
    </div>
    <label>Headline<input name="headline"></label>
    <label>Selected/visible evidence<textarea name="selected_text"></textarea></label>
    <button type="submit">Capture to local AFI-OS</button>
    <div id="message"></div>
  </form>
  <script src="popup.js"></script>
</body>
</html>
